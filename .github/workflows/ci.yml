# Build everything Kwiet is made of, on every push.
#
# The three halves of the product are built by three different toolchains, and
# they only ever meet inside the installer -- so the installer is built here
# too, even though CI cannot sign it. An unsigned bundle still proves that the
# effect pack was assembled and embedded correctly, which is the part that
# silently breaks.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            dsp -> target
            ui/src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # The logo and icons are committed, but they are generated: this catches a
      # hand-edited SVG that the generator would overwrite on the next run.
      # Rasters need ImageMagick, which the runner does not have; the generator
      # stops after the SVGs on its own.
      - name: Les assets générés sont à jour
        run: |
          node assets/build-assets.mjs
          git diff --exit-code -- assets/svg ui/src/mark.svg

      - name: APO (C++)
        run: |
          cmake -S apo -B apo/build -A x64
          cmake --build apo/build --config Release

      - name: DSP (Rust)
        working-directory: dsp
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --release --locked

      - name: Panneau (Rust)
        working-directory: ui/src-tauri
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      # Unsigned: Windows will refuse to install it, which is fine here. What
      # matters is that the package assembles and Tauri finds it to embed.
      - name: Pack d'effets (non signé)
        run: ./installer/effectpack/build-package.ps1
        shell: pwsh

      - name: Installeur
        working-directory: ui
        run: |
          npm ci
          npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: kwiet-setup-unsigned
          path: ui/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
