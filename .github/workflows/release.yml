# Publish a release from a `vX.Y.Z` tag.
#
# The tag is the source of truth for the version: it is written into
# tauri.conf.json and passed to the effect pack, so an installer cannot announce
# a version different from the one it puts in the driver store.
#
# Signing: when the secrets are present, the DLLs and the catalogue are signed
# and the installer trusts the signing certificate on the target machine.
# Without them the release still goes out, but its notes say plainly that the
# package is unsigned -- Windows refuses a driver package whose catalogue does
# not chain to a trusted root, and it is better written down than discovered by
# installing.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version x.y.z (without the v)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest

    # Hoisted to job level: an `if:` condition cannot see an `env:` declared on
    # the step it guards, so the guard below was always false and the signing
    # step would have been skipped even with the secrets in place.
    env:
      SIGNING_PFX: ${{ secrets.SIGNING_PFX }}
      SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.version }}'
          } else {
            '${{ github.ref_name }}' -replace '^v', ''
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Expected a version of the form x.y.z, got: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "Version: $version"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            dsp -> target
            ui/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: APO (C++)
        run: |
          cmake -S apo -B apo/build -A x64
          cmake --build apo/build --config Release

      - name: DSP (Rust)
        working-directory: dsp
        run: |
          cargo test --release --locked
          cargo build --release

      - name: Align the version with the tag
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $conf = 'ui/src-tauri/tauri.conf.json'
          $json = Get-Content $conf -Raw
          $json = $json -replace '"version": "[^"]*"', ('"version": "{0}"' -f $version)
          Set-Content $conf $json -Encoding utf8 -NoNewline
          # The [package] table only. Cargo.toml carries other lines starting
          # with `version = "..."` -- the one under [dependencies.windows] among
          # them -- and a global replace wrote Kwiet's version there, after which
          # the build failed on "failed to select a version for windows".
          $cargo = 'ui/src-tauri/Cargo.toml'
          $text = Get-Content $cargo -Raw
          $re = [regex]::new('(?ms)(^\[package\].*?^version\s*=\s*)"[^"]*"')
          $text = $re.Replace($text, ('${1}"' + $version + '"'), 1)
          Set-Content $cargo $text -Encoding utf8 -NoNewline

      - name: Signing certificate
        id: cert
        if: env.SIGNING_PFX != ''
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:SIGNING_PFX)
          $path = Join-Path $env:RUNNER_TEMP 'kwiet-signing.pfx'
          [IO.File]::WriteAllBytes($path, $bytes)
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Effect pack
        shell: pwsh
        run: |
          # Hashtable, not array: splatting an array passes its elements
          # POSITIONALLY, so -Version arrived as the value of $Version and the
          # version itself as the value of $CertPath.
          $packArgs = @{ Version = '${{ steps.version.outputs.version }}' }
          if ('${{ steps.cert.outputs.path }}') {
            $packArgs.CertPath = '${{ steps.cert.outputs.path }}'
            $packArgs.CertPassword = $env:SIGNING_PFX_PASSWORD
          }
          ./installer/effectpack/build-package.ps1 @packArgs

      - name: Installer
        working-directory: ui
        run: |
          npm ci
          npm run tauri build

      - name: Checksums
        shell: pwsh
        run: |
          $dir = 'ui/src-tauri/target/release/bundle/msi'
          Get-ChildItem "$dir/*.msi" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)"
          } | Set-Content "$dir/SHA256SUMS.txt" -Encoding ascii
          Get-Content "$dir/SHA256SUMS.txt"

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $dir = 'ui/src-tauri/target/release/bundle/msi'
          $signed = '${{ steps.cert.outputs.path }}' -ne ''
          $notes = @"
          ## Install

          1. Download the MSI for your language — ``Kwiet_${version}_x64_en-US.msi``
             or ``Kwiet_${version}_x64_fr-FR.msi`` — and run it.
          2. **Choose Kwiet** in Settings → Sound → your microphone → Audio
             enhancements. Until you do, Kwiet is installed and inert: the panel
             will tell you so, with a button to open the right page.

          Windows 11 24H2 or newer, x64, microphone at 48 kHz.
          "@
          if ($signed) {
            $notes += @"

          ### About the signature

          The effect pack is a driver package, and Windows only registers one
          whose catalogue chains to a trusted root. Kwiet is signed with its own
          self-signed key, so the installer adds that **public certificate** to
          the machine's Trusted Root and Trusted Publishers stores before
          registering the pack, and removes it again when you uninstall.

          The certificate carries the Code Signing usage and nothing else, so it
          cannot vouch for TLS certificates. The private key never ships. Even
          so, it is a real grant of trust — a commercial code-signing
          certificate, which chains to a root already present everywhere and
          needs nothing added, is the cleaner answer and is on the list.
          "@
          } else {
            $notes += @"

          > [!WARNING]
          > **Unsigned package.** Windows will refuse to register the effect
          > pack: the app installs, the microphone is not processed, and the
          > panel shows "Effect pack missing".
          "@
          }
          $assets = @(Get-ChildItem "$dir/*.msi" | ForEach-Object { $_.FullName })
          $assets += (Resolve-Path "$dir/SHA256SUMS.txt").Path
          gh release create "v$version" @assets `
            --title "Kwiet $version" `
            --notes $notes
