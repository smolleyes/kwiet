# Build everything Kwiet is made of, on every push.
#
# The three halves of the product are built by three different toolchains and
# only ever meet inside the installer -- so the installer is built here too,
# even though CI cannot sign it. An unsigned bundle still proves the effect pack
# was assembled and embedded correctly, which is the part that breaks silently.

name: CI

# Not on push to main. A cold build takes twenty minutes, and running one on
# every documentation commit -- alongside the release build a tag kicks off in
# parallel -- was noise, not safety. Tags are the only automatic trigger now;
# the release workflow replays the whole chain, tests included.
on:
  pull_request:
  workflow_dispatch:

# A cold build compiles tract from source and takes a quarter of an hour. No
# point spending that on a commit a newer push has already replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            dsp -> target
            ui/src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # The logo and icons are committed, but they are generated: this catches a
      # hand-edited SVG that the generator would overwrite on its next run.
      # Rasters need ImageMagick, which the runner does not have; the generator
      # stops after the SVGs on its own.
      - name: Generated assets are up to date
        run: |
          node assets/build-assets.mjs
          git diff --exit-code -- assets/svg ui/src/mark.svg

      - name: APO (C++)
        run: |
          cmake -S apo -B apo/build -A x64
          cmake --build apo/build --config Release

      - name: DSP (Rust)
        working-directory: dsp
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --release --locked
          # `cargo test` builds the library for its own harness and stops there;
          # the cdylib the effect pack ships is only emitted by `cargo build`.
          cargo build --release --locked

      # Before the panel, not after: tauri-build resolves bundle resources from
      # build.rs, so *any* cargo command on ui/src-tauri fails outright while the
      # pack directory is missing -- clippy and tests included. That strictness
      # is worth keeping: it makes an installer without its effect pack
      # impossible to build by accident.
      #
      # Unsigned here. Windows will refuse to install it, which is fine: what
      # this proves is that the package assembles and Tauri finds it to embed.
      - name: Effect pack (unsigned)
        run: ./installer/effectpack/build-package.ps1
        shell: pwsh

      - name: Panel (Rust)
        working-directory: ui/src-tauri
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      - name: Installer
        working-directory: ui
        run: |
          npm ci
          npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: kwiet-msi-unsigned
          path: ui/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
