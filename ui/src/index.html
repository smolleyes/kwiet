<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kwiet</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="bar" data-tauri-drag-region>
      <span class="brand" data-tauri-drag-region>
        <img class="brand-mark" src="mark.svg" alt="" width="18" height="18" />
        <span class="wordmark" data-tauri-drag-region>KWIET</span>
      </span>
      <span class="state" id="state">
        <i class="dot" id="dot"></i><span id="stateText">…</span>
      </span>
    </header>

    <main>
      <!-- Signature: the gap between the two envelopes is what Kwiet removes. -->
      <section class="scope" aria-label="Signal">
        <canvas id="scope" width="656" height="240"></canvas>
        <div class="scope-idle" id="scopeIdle" hidden>
          <p class="idle-title" id="idleTitle"></p>
          <p class="idle-body" id="idleBody"></p>
          <button type="button" class="idle-action" id="idleAction" data-i18n="idle.action" hidden></button>
        </div>
        <div class="legend">
          <span class="key key-removed" data-i18n="legend.removed"></span>
          <span class="key key-kept" data-i18n="legend.kept"></span>
        </div>
      </section>

      <section class="meter">
        <div class="meter-head">
          <p class="eyebrow" data-i18n="meter.label"></p>
          <output class="meter-value" id="meterValue">—</output>
        </div>
        <!-- One bar, two readings: the bright fill is what apps receive, the
             amber sticking out past it is what Kwiet took away. -->
        <div class="meter-track" id="meterTrack">
          <div class="meter-noise" id="meterNoise"></div>
          <div class="meter-fill" id="meterFill"></div>
          <div class="meter-peak" id="meterPeak"></div>
        </div>
        <!-- Evenly spaced, because the labels are laid out evenly. Marking −6
             here would put it at three quarters of the bar when the meter puts
             it at nine tenths. -->
        <div class="meter-scale" aria-hidden="true">
          <span>−60</span><span>−45</span><span>−30</span><span>−15</span><span>0</span>
        </div>
        <p class="meter-removed" id="meterRemoved"></p>
      </section>

      <section class="control">
        <div class="control-head">
          <label class="eyebrow" for="aggressiveness" data-i18n="control.label"></label>
          <output class="value" id="aggressivenessValue">50 dB</output>
        </div>
        <input
          type="range"
          id="aggressiveness"
          min="0"
          max="100"
          step="1"
          value="50"
          aria-describedby="aggressivenessHint"
        />
        <div class="scale">
          <span data-i18n="control.low"></span>
          <span data-i18n="control.high"></span>
        </div>
        <p class="hint" id="aggressivenessHint" data-i18n="control.hint"></p>
      </section>

      <section class="toggle-row">
        <div>
          <p class="toggle-label" data-i18n="toggle.label"></p>
          <p class="toggle-sub" id="toggleSub"></p>
        </div>
        <button
          type="button"
          class="switch"
          id="enabled"
          role="switch"
          aria-checked="true"
        >
          <span class="knob"></span>
        </button>
      </section>
    </main>

    <footer class="foot">
      <span class="status" id="status">—</span>
      <span class="lang" id="lang" role="group" aria-label="Langue / Language">
        <button type="button" data-lang="fr">FR</button>
        <button type="button" data-lang="en">EN</button>
      </span>
    </footer>

    <script type="module" src="main.js"></script>
  </body>
</html>
