[package]
name = "kwiet-ui"
version = "0.2.1"
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0"
description = "Kwiet tray UI"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    # Which microphone Windows actually hands to applications.
    "Win32_System_Com",
    "Win32_Media_Audio",
    # Opening the Settings page where the effect pack is chosen.
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # Picking French or English on first run.
    "Win32_Globalization",
    # Anchoring the panel above the taskbar rather than centring it.
    "Win32_Graphics_Gdi",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
